name: Bug
description: Report incorrect or regressed behavior.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include exact inputs, errors, and relevant environment details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the shortest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Regression is covered by an automated test"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: State how the fix and surrounding behavior will be checked.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Primary impact
      options:
        - Trading semantics
        - Market data
        - API or schema
        - Deployment or operations
        - None
    validations:
      required: true
