changelog:
  categories:
    - title: Features
      labels: ["type:feature"]
    - title: Fixes
      labels: ["type:bug"]
    - title: Security
      labels: ["type:security"]
    - title: Documentation
      labels: ["type:docs"]
    - title: Maintenance
      labels: ["type:maintenance"]
    - title: Dependency Updates
      labels: ["dependencies"]
    - title: Other Changes
      labels: ["*"]
      exclude:
        labels: ["dependencies"]
